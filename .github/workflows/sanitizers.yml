name: sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Builds the kx_skia C/C++ shim with clang -fsanitize=address,undefined
# (-Dsanitize) and runs the test suite + headless smokes. Zig code itself
# is not instrumented, and prebuilt Skia/SDL3 stay unsanitized — findings
# point at the shim.
#
# Zig ships no ASan runtime, so build.zig links the host's: clang's
# libclang_rt.asan-*.so via `clang -print-file-name`, else gcc's
# libasan.so.8 (same upstream ABI). On macOS it links a lipo/vtool-stripped
# copy of the toolchain's zippered asan dylib (see macOsAsanRt).

jobs:
  sanitize:
    name: asan+ubsan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # LeakSanitizer would surface prebuilt-Skia/SDL3 + allocator noise,
      # not shim bugs — off until the report is triaged.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v7

      - name: Check arch (macOS is arm64 only — no x64)
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Klaxon targets macOS arm64 only (no x64)."; exit 1
          fi

      - uses: ./.github/actions/setup-deps
        with:
          # Same key pattern as ci.yml — shares the deps cache.
          cache-key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/patches/**') }}
          # ci.yml's package list plus an ASan runtime: libclang-rt-dev is
          # the preferred match for zig cc's instrumentation, libasan8 is
          # the ABI-compatible gcc fallback (see linuxAsanRt in build.zig).
          apt-packages: >-
            clang libclang-rt-dev libasan8
            libc++-dev libc++abi-dev
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev
            libwayland-dev wayland-protocols libxkbcommon-dev
            libegl1-mesa-dev libgles2-mesa-dev
            libasound2-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev libibus-1.0-dev
            libatk1.0-dev libatk-bridge2.0-dev libatspi2.0-dev

      - name: Build (sanitized shim)
        run: zig build -Dsanitize

      - name: Test
        run: zig build test -Dsanitize

      - name: Golden tests
        run: zig build test-golden -Dsanitize

      - name: Headless smoke (raster, 600 frames)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/hello

      - name: Gallery headless smoke (raster, 600 frames)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/gallery
