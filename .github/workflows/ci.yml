name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check arch (macOS is arm64 only — no x64)
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Klaxon targets macOS arm64 only (no x64)."; exit 1
          fi

      - name: Install Zig 0.17.0 (pinned, ADR-0001)
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  zig_target=aarch64-macos ;;
            Linux-x86_64)  zig_target=x86_64-linux ;;
            *) echo "unsupported CI host: $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/0.17.0/zig-${zig_target}-0.17.0.tar.xz"
          tar -xf zig.tar.xz
          zig_dir="$(pwd)/zig-${zig_target}-0.17.0"
          echo "$zig_dir" >> "$GITHUB_PATH"
          export PATH="$zig_dir:$PATH" # GITHUB_PATH only applies to later steps
          zig version

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Install Linux build deps (libc++ + X11/Wayland dev — SDL3 cmake requires them)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev libibus-1.0-dev

      - name: Fetch + build deps (Skia, SDL3, WAMR)
        run: scripts/fetch-deps.sh

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Golden tests
        run: zig build test-golden

      - name: Headless smoke (raster, 600 frames)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/hello

      - name: Gallery headless smoke (raster, 600 frames)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/gallery

      - name: Navigator headless smoke (raster, 600 frames, scripted transitions)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/navigator

      - name: i18n headless smoke (raster, 600 frames, scripted locale switches)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/i18n

      - name: A11y headless smoke (raster, 600 frames, scripted keyboard)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/a11y

      - name: ReleaseSmall build + size gate (< 6,8 Mo)
        run: |
          zig build -Doptimize=ReleaseSmall
          size=$(wc -c < zig-out/bin/hello)
          echo "hello (ReleaseSmall): $size bytes"
          if [ "$size" -ge 7127245 ]; then
            echo "SIZE GATE FAILED: $size >= 6,8 Mo"; exit 1
          fi

  # Phase 3f — wasm web target (docs/specs/phase-3f-wasm-plan.md §7).
  # Separate job, runs in parallel with build-test. Builds ONLY the wasm
  # target: no native exes, no native tests.
  build-wasm:
    name: build-wasm (Linux)
    runs-on: ubuntu-latest
    # Non-blocking while the wasm toolchain is being debugged (shim compile
    # for wasm32-emscripten via zig cc has header path issues). The native
    # build-test job is the merge gate; build-wasm will become required once
    # the emscripten sysroot include paths are fully resolved.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0 (pinned, ADR-0001)
        run: |
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz"
          tar -xf zig.tar.xz
          zig_dir="$(pwd)/zig-x86_64-linux-0.17.0"
          echo "$zig_dir" >> "$GITHUB_PATH"
          export PATH="$zig_dir:$PATH" # GITHUB_PATH only applies to later steps
          zig version

      - name: Install build deps (python3, ninja, cmake, clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build cmake clang libc++-dev libc++abi-dev

      - name: Cache deps (native + wasm)
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-wasm-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Fetch + build wasm deps (emsdk + Skia wasm + SDL3 wasm)
        run: scripts/fetch-deps.sh web-wasm
        # NOTE: c'est lourd (~1-2 GB, 15-45 min). Le cache deps accélère les runs suivants.

      - name: Build wasm web target
        run: zig build -Dtarget=wasm32-emscripten -Doptimize=ReleaseSmall web

      - name: Size gate
        run: |
          SIZE=$(stat -c%s zig-out/web/hello.wasm 2>/dev/null || stat -f%z zig-out/web/hello.wasm)
          echo "hello.wasm size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          # Budget: < 15 MB (plan §6). Fail si depasse.
          if [ "$SIZE" -gt 15728640 ]; then echo "WASM TOO LARGE: $SIZE > 15 MB"; exit 1; fi

      - name: Smoke test (check wasm artifacts exist)
        run: |
          ls -la zig-out/web/
          test -f zig-out/web/hello.html
          test -f zig-out/web/hello.js
          test -f zig-out/web/hello.wasm
          echo "All wasm artifacts present."

  # Phase 3d — Android target (aarch64-linux-android). Separate job, runs in
  # parallel with build-test. Zig builds the app as a static lib
  # (`zig build -Dtarget=aarch64-linux-android android-lib` ->
  # zig-out/lib/libgallery.a); Gradle + CMake/NDK link the kx_skia shim +
  # Skia + SDL3 into libmain.so and package the APK. assembleDebug only:
  # auto-signed with the SDK debug key, no keystore in CI. Non-blocking for
  # the first iteration — the native build-test job remains the merge gate.
  build-android:
    name: build-android (Linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0 (pinned, ADR-0001)
        run: |
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz"
          tar -xf zig.tar.xz
          zig_dir="$(pwd)/zig-x86_64-linux-0.17.0"
          echo "$zig_dir" >> "$GITHUB_PATH"
          export PATH="$zig_dir:$PATH" # GITHUB_PATH only applies to later steps
          zig version

      - name: Setup JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build deps (ninja, cmake, clang, python3, unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang python3 unzip

      - name: Install Android SDK (cmdline-tools, platform 35, build-tools 35, NDK 27.1)
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-android-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Fetch + build Android deps (Skia + SDL3, android-arm64)
        run: scripts/fetch-deps.sh android-arm64
        # NOTE: lourd (~1-2 GB, 15-45 min au premier run). Le cache deps
        # accélère les runs suivants. Requires ANDROID_HOME/ANDROID_NDK_HOME
        # (exported by the SDK step above — fetch-deps.sh detect_ndk).

      - name: Build Android static lib (zig)
        run: zig build -Dtarget=aarch64-linux-android android-lib

      - name: Build debug APK (Gradle assembleDebug — auto-signed)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: klaxon-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Size gate (APK < 40 Mo)
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          # Budget: < 40 MB (placeholder). Fail si depasse.
          if [ "$SIZE" -ge 41943040 ]; then echo "APK TOO LARGE: $SIZE >= 40 MB"; exit 1; fi

  # Phase 3e — iOS target (aarch64-ios.15.0 / aarch64-ios.15.0-simulator).
  # Separate job on macOS arm64: Xcode is required (Skia + SDL3 iOS deps via
  # scripts/fetch-deps.sh ios, and the xcrun clang++ link step in build.zig).
  # Builds the simulator binary first (best-effort simctl smoke), then the
  # device binary (size gate). Non-blocking for the first iteration — the ios
  # deps take 30-90 min on first run; build-test remains the merge gate.
  build-ios:
    name: build-ios (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0 (pinned, ADR-0001)
        run: |
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz"
          tar -xf zig.tar.xz
          zig_dir="$(pwd)/zig-aarch64-macos-0.17.0"
          echo "$zig_dir" >> "$GITHUB_PATH"
          export PATH="$zig_dir:$PATH" # GITHUB_PATH only applies to later steps
          zig version

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-macos-ios-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Fetch + build iOS deps (Skia + SDL3, device + simulator)
        run: scripts/fetch-deps.sh ios
        # NOTE: très lourd (~30-90 min au premier run: 4 builds Skia/SDL3,
        # device + sim). Le cache deps accélère les runs suivants.

      - name: Build iOS simulator binary (ReleaseSmall)
        run: zig build -Dtarget=aarch64-ios.15.0-simulator -Doptimize=ReleaseSmall ios-gallery

      - name: Smoke test (boot + install + launch on simulator — best effort)
        continue-on-error: true
        run: |
          set -e
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; rs=json.load(sys.stdin); print(next(r['identifier'] for r in rs if r['isAvailable'] and r['name'].startswith('iOS')))")
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; dts=json.load(sys.stdin); print(next(d['identifier'] for d in dts if 'iPhone' in d['name']))")
          xcrun simctl create klaxon-ci "$DEVICE_TYPE" "$RUNTIME"
          xcrun simctl boot klaxon-ci
          xcrun simctl bootstatus booted -b
          # zig-out/ios/gallery is a raw Mach-O, not a bundle: wrap it in a
          # minimal .app so simctl can install it (ad-hoc signed for the sim).
          mkdir -p zig-out/ios/gallery.app
          cp zig-out/ios/gallery zig-out/ios/gallery.app/gallery
          codesign --force --sign - zig-out/ios/gallery.app/gallery
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleExecutable</key><string>gallery</string><key>CFBundleIdentifier</key><string>com.klaxon.gallery.ci</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleVersion</key><string>1</string><key>MinimumOSVersion</key><string>15.0</string></dict></plist>' > zig-out/ios/gallery.app/Info.plist
          xcrun simctl install booted zig-out/ios/gallery.app
          xcrun simctl launch booted com.klaxon.gallery.ci
          sleep 5
          xcrun simctl terminate booted com.klaxon.gallery.ci || true
          xcrun simctl shutdown klaxon-ci || true
          echo "Simulator smoke OK (installed + launched gallery.app)"

      - name: Build iOS device binary (ReleaseSmall)
        run: zig build -Dtarget=aarch64-ios.15.0 -Doptimize=ReleaseSmall ios-gallery

      - name: Size gate (binary < 20 Mo)
        run: |
          SIZE=$(stat -f%z zig-out/ios/gallery)
          echo "iOS binary size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          # Budget: < 20 MB (placeholder — no .ipa packaging yet, the gate
          # runs on the raw device binary). Fail si depasse.
          if [ "$SIZE" -ge 20971520 ]; then echo "IOS BINARY TOO LARGE: $SIZE >= 20 MB"; exit 1; fi
