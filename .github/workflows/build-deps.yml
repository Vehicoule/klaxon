# build-deps.yml — build + publish prebuilt dependency artifacts.
#
# fetch-deps.sh downloads deps-<bundle>.tar.gz from the `deps-<DEPS_ID>`
# release (DEPS_ID = first 12 chars of the fetch-deps.sh sha256 — any pin or
# args change produces a new release key, stale artifacts are unreachable).
# This workflow builds those artifacts so `scripts/fetch-deps.sh` is a
# seconds-long download instead of a 30-60 min Skia compile.
#
# Runs on pushes that touch the dep scripts, and on manual dispatch (e.g.
# first bootstrap after a pin bump — the release only appears once this has
# run; until then consumers transparently fall back to source builds).
name: build-deps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-deps.sh, scripts/pack-deps.sh]

permissions:
  contents: write # gh release create/upload

concurrency:
  group: build-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps-id:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: id
        run: echo "id=$( (sha256sum 2>/dev/null || shasum -a 256) < scripts/fetch-deps.sh | cut -c1-12)" >> "$GITHUB_OUTPUT"

  native:
    needs: deps-id
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tag: linux-x64 }
          - { os: ubuntu-24.04-arm, tag: linux-arm64 }
          - { os: macos-15, tag: macos-arm64 }
          - { os: windows-latest, tag: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows (fetch-deps/pack-deps are bash)
    steps:
      - uses: actions/checkout@v4
      - name: arm64 toolchain fixes (gn x64-only; clang outline-atomics)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y generate-ninja
          echo "KLAXON_GN=$(command -v gn)" >> "$GITHUB_ENV"
          # Ubuntu arm64 clang defaults to -moutline-atomics → cmake-built
          # deps (SDL3, WAMR) would reference __aarch64_*_sync helpers that
          # zig's bundled builtins don't provide.
          echo "CFLAGS=-mno-outline-atomics" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-mno-outline-atomics" >> "$GITHUB_ENV"
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        # atk/atspi dev packages aren't needed to BUILD Skia/SDL, but keep the
        # runner able to compile the app too (kx_a11y_linux.cpp) — parity with
        # ci.yml's apt-packages list.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev libibus-1.0-dev \
            libatk1.0-dev libatk-bridge2.0-dev libatspi2.0-dev
      - name: Windows prerequisites
        if: runner.os == 'Windows'
        run: command -v ninja >/dev/null || choco install -y ninja
      - name: Build native deps
        run: scripts/fetch-deps.sh
      - name: Pack native bundle
        run: scripts/pack-deps.sh native
      - name: Publish artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS_ID: ${{ needs.deps-id.outputs.id }}
        run: |
          gh release create "deps-$DEPS_ID" --title "deps-$DEPS_ID" --notes "Prebuilt Klaxon deps (fetch-deps.sh $DEPS_ID)" || true
          gh release upload "deps-$DEPS_ID" dist/*.tar.gz dist/*.sha256 --clobber

  wasm:
    needs: deps-id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang libc++-dev
      - run: scripts/fetch-deps.sh web-wasm
      - run: scripts/pack-deps.sh web-wasm
      - name: Publish artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS_ID: ${{ needs.deps-id.outputs.id }}
        run: |
          gh release create "deps-$DEPS_ID" --title "deps-$DEPS_ID" --notes "Prebuilt Klaxon deps (fetch-deps.sh $DEPS_ID)" || true
          gh release upload "deps-$DEPS_ID" dist/*.tar.gz dist/*.sha256 --clobber

  android:
    needs: deps-id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: scripts/fetch-deps.sh android-arm64
      - run: scripts/pack-deps.sh android-arm64
      - name: Publish artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS_ID: ${{ needs.deps-id.outputs.id }}
        run: |
          gh release create "deps-$DEPS_ID" --title "deps-$DEPS_ID" --notes "Prebuilt Klaxon deps (fetch-deps.sh $DEPS_ID)" || true
          gh release upload "deps-$DEPS_ID" dist/*.tar.gz dist/*.sha256 --clobber

  ios:
    needs: deps-id
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-deps.sh ios
      - run: scripts/pack-deps.sh ios
      - name: Publish artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS_ID: ${{ needs.deps-id.outputs.id }}
        run: |
          gh release create "deps-$DEPS_ID" --title "deps-$DEPS_ID" --notes "Prebuilt Klaxon deps (fetch-deps.sh $DEPS_ID)" || true
          gh release upload "deps-$DEPS_ID" dist/*.tar.gz dist/*.sha256 --clobber
