# Project-wide Gradle settings (klaxon-bench-compose-android).
# Mirrors android/gradle.properties + the desktop runner's heap caps.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep build parallelism moderate: other builds may run on this machine.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2g
