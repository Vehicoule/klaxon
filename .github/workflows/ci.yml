name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Zig install, the deps/ cache and scripts/fetch-deps.sh are shared by all
# jobs via the composite action in .github/actions/setup-deps — the cache
# key pattern is 'deps-<target>-${{ hashFiles('scripts/fetch-deps.sh',
# 'scripts/patches/**') }}' and MUST stay identical across jobs (a hash
# change cold-builds every deps cache, ~15-90 min).

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        # bash everywhere: smoke steps use env-prefix + POSIX paths
        # (Git Bash on windows-latest, login shell elsewhere).
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers the linux-arm64 target (fetch-deps
        # linux-arm64 tag); x64 stays on ubuntu-latest. windows-latest
        # covers windows-x64 (Git Bash + MSVC + Dawn stack, Phase 3c).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Check arch (macOS is arm64 only — no x64)
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Klaxon targets macOS arm64 only (no x64)."; exit 1
          fi

      - name: arm64 toolchain fixes (gn x64-only; clang outline-atomics)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y generate-ninja
          echo "KLAXON_GN=$(command -v gn)" >> "$GITHUB_ENV"
          # Ubuntu arm64 clang defaults to -moutline-atomics → cmake-built
          # deps (SDL3, WAMR) would reference __aarch64_*_sync helpers that
          # zig's bundled builtins don't provide.
          echo "CFLAGS=-mno-outline-atomics" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-mno-outline-atomics" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-deps
        with:
          cache-key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/patches/**') }}
          # Linux build deps: libc++ + X11/Wayland dev — SDL3 cmake requires them.
          # libatk/libatk-bridge/libatspi dev: the Phase 3a a11y bridge
          # (kx_a11y_linux.cpp) compiles against ATK/AT-SPI headers and links
          # libatk + libatk-bridge via pkg-config.
          apt-packages: >-
            libc++-dev libc++abi-dev
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev
            libwayland-dev wayland-protocols libxkbcommon-dev
            libegl1-mesa-dev libgles2-mesa-dev
            libasound2-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev libibus-1.0-dev
            libatk1.0-dev libatk-bridge2.0-dev libatspi2.0-dev

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Golden tests
        run: zig build test-golden

      # ReleaseSafe pass: runtime-safety builds are where the allocators'
      # leak/double-free detection is active (testing.SafeAllocator +
      # DebugAllocator deinit gates).
      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: Golden tests (ReleaseSafe)
        run: zig build test-golden -Doptimize=ReleaseSafe

      - name: Conformance suite
        run: zig build conformance

      - name: Headless smoke (raster, 600 frames)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/hello

      - name: Gallery headless smoke (raster, 600 frames)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/gallery

      - name: Navigator headless smoke (raster, 600 frames, scripted transitions)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/navigator

      - name: i18n headless smoke (raster, 600 frames, scripted locale switches)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/i18n

      - name: A11y headless smoke (raster, 600 frames, scripted keyboard)
        run: SDL_VIDEODRIVER=dummy ./zig-out/bin/a11y

      - name: ReleaseSmall build + size gate
        run: |
          zig build -Doptimize=ReleaseSmall
          bin=zig-out/bin/hello; [ -f "$bin" ] || bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "hello (ReleaseSmall): $size bytes"
          # Every desktop binary now links the real text stack (skparagraph
          # + skshaper + skunicode_icu + harfbuzz) and mcu — ~22,0 Mio on
          # linux, ~20,9 Mo on macOS (graphite-metal + ganesh-gl), ~19,4 Mo
          # on Windows (dawn+graphite into libskia). 24 Mio gate leaves a
          # few MiB of headroom on the fattest target.
          limit=25165824
          if [ "$size" -ge "$limit" ]; then
            echo "SIZE GATE FAILED: $size >= $limit"; exit 1
          fi

  # Phase 3f — wasm web target (docs/specs/phase-3f-wasm-plan.md §7).
  # Separate job, runs in parallel with build-test. Builds ONLY the wasm
  # target: no native exes, no native tests.
  build-wasm:
    name: build-wasm (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Required gate since 2026-10-11: the emscripten sysroot include-order fix
    # landed on main — build-wasm goes green and stays blocking.
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          cache-key: deps-wasm-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/patches/**') }}
          # emsdk + Skia wasm + SDL3 wasm — heavy (~1-2 GB, 15-45 min cold);
          # the deps cache makes warm runs fast.
          deps-args: web-wasm
          apt-packages: python3 ninja-build cmake clang libc++-dev libc++abi-dev

      # Eager cache save for the wasm deps: actions/cache's post-job save is
      # skipped when a later step fails (post-if: success()), which would
      # make every failed run pay the ~15 min cold build again. Once a run
      # has saved the key, later saves no-op; continue-on-error covers a
      # concurrent-save key conflict.
      - name: Save deps cache now (failure-proof post-save)
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: deps
          key: deps-wasm-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/patches/**') }}

      - name: Build wasm web target
        run: zig build -Dtarget=wasm32-emscripten -Doptimize=ReleaseSmall web

      - name: Size gate
        run: |
          SIZE=$(stat -c%s zig-out/web/hello.wasm 2>/dev/null || stat -f%z zig-out/web/hello.wasm)
          echo "hello.wasm size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          # Budget: < 15 MB (plan §6). Fail si depasse.
          if [ "$SIZE" -gt 15728640 ]; then echo "WASM TOO LARGE: $SIZE > 15 MB"; exit 1; fi

      - name: Smoke test (check wasm artifacts exist)
        run: |
          ls -la zig-out/web/
          test -f zig-out/web/hello.html
          test -f zig-out/web/hello.js
          test -f zig-out/web/hello.wasm
          echo "All wasm artifacts present."

  # Phase 3d — Android target (aarch64-linux-android). Separate job, runs in
  # parallel with build-test. Zig builds the app as a static lib
  # (`zig build -Dtarget=aarch64-linux-android android-lib` ->
  # zig-out/lib/libgallery.a); Gradle + CMake/NDK link the kx_skia shim +
  # Skia + SDL3 into libmain.so and package the APK. assembleDebug only:
  # auto-signed with the SDK debug key, no keystore in CI.
  # Required gate since 2026-10-11: the APK builds and renders on the
  # emulator (Phase 3d complete).
  build-android:
    name: build-android (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17 (temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline-tools, platform 35, build-tools 35, NDK 27.1)
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      # ANDROID_HOME/ANDROID_NDK_HOME exported above reach this step via
      # GITHUB_ENV — fetch-deps.sh detect_ndk requires them.
      - uses: ./.github/actions/setup-deps
        with:
          cache-key: deps-android-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/patches/**') }}
          # Skia + SDL3 for android-arm64 — heavy (~1-2 GB, 15-45 min cold).
          deps-args: android-arm64
          apt-packages: ninja-build cmake clang python3 unzip

      - name: Build Android static lib (zig)
        run: zig build -Dtarget=aarch64-linux-android android-lib

      - name: Build debug APK (Gradle assembleDebug — auto-signed)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: klaxon-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Size gate (APK < 40 Mo)
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          # Budget: < 40 MB (placeholder). Fail si depasse.
          if [ "$SIZE" -ge 41943040 ]; then echo "APK TOO LARGE: $SIZE >= 40 MB"; exit 1; fi

  # Phase 3e — iOS target (aarch64-ios.15.0 / aarch64-ios.15.0-simulator).
  # Separate job on macOS arm64: Xcode is required (Skia + SDL3 iOS deps via
  # scripts/fetch-deps.sh ios, and the xcrun clang++ link step in build.zig).
  # Builds the simulator binary first (best-effort simctl smoke), then the
  # device binary (size gate).
  # Required gate since 2026-10-11: iOS builds for simulator + device and
  # renders on the simulator (Phase 3e). The deps fetch is heavy (~30-90 min
  # cold: 4 Skia/SDL3 builds) — the deps cache keeps warm runs at ~3 min.
  build-ios:
    name: build-ios (macOS)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          cache-key: deps-macos-ios-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/patches/**') }}
          deps-args: ios

      - name: Build iOS simulator binary (ReleaseSmall)
        run: zig build -Dtarget=aarch64-ios.15.0-simulator -Doptimize=ReleaseSmall ios-gallery

      - name: Smoke test (boot + install + launch on simulator — best effort)
        # Stays best-effort at step level: simctl on hosted runners is
        # occasionally flaky (slow runtime boot / install races), and the
        # hard gate for this job is the build + size gate. A failure still
        # surfaces as an annotation on the run.
        continue-on-error: true
        run: |
          set -e
          # simctl -j wraps results in an object ({runtimes,devicetypes: [...]});
          # iterate the array, not the top-level dict.
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; rs=json.load(sys.stdin)['runtimes']; print(next(r['identifier'] for r in rs if (r.get('isAvailable') is True or r.get('availability') == '(available)') and r.get('name','').startswith('iOS')))")
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; dts=json.load(sys.stdin)['devicetypes']; print(next(d['identifier'] for d in dts if 'iPhone' in d.get('name','')))")
          xcrun simctl create klaxon-ci "$DEVICE_TYPE" "$RUNTIME"
          xcrun simctl boot klaxon-ci
          xcrun simctl bootstatus booted -b
          # zig-out/ios/gallery is a raw Mach-O, not a bundle: wrap it in a
          # minimal .app so simctl can install it (ad-hoc signed for the sim).
          mkdir -p zig-out/ios/gallery.app
          cp zig-out/ios/gallery zig-out/ios/gallery.app/gallery
          codesign --force --sign - zig-out/ios/gallery.app/gallery
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleExecutable</key><string>gallery</string><key>CFBundleIdentifier</key><string>com.klaxon.gallery.ci</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleVersion</key><string>1</string><key>MinimumOSVersion</key><string>15.0</string></dict></plist>' > zig-out/ios/gallery.app/Info.plist
          xcrun simctl install booted zig-out/ios/gallery.app
          xcrun simctl launch booted com.klaxon.gallery.ci
          sleep 5
          xcrun simctl terminate booted com.klaxon.gallery.ci || true
          xcrun simctl shutdown klaxon-ci || true
          echo "Simulator smoke OK (installed + launched gallery.app)"

      - name: Build iOS device binary (ReleaseSmall)
        run: zig build -Dtarget=aarch64-ios.15.0 -Doptimize=ReleaseSmall ios-gallery

      - name: Size gate (binary < 20 Mo)
        run: |
          SIZE=$(stat -f%z zig-out/ios/gallery)
          echo "iOS binary size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          # Budget: < 20 MB (placeholder — no .ipa packaging yet, the gate
          # runs on the raw device binary). Fail si depasse.
          if [ "$SIZE" -ge 20971520 ]; then echo "IOS BINARY TOO LARGE: $SIZE >= 20 MB"; exit 1; fi
