name: valgrind

on:
  schedule:
    - cron: '23 4 * * *' # nightly
  workflow_dispatch:

# Nightly memcheck pass over the headless smoke apps (scripts/valgrind.sh).
# Informational: the job is continue-on-error — prebuilt Skia/SDL3 noise is
# uncharted, so ci/valgrind.supp is seeded conservatively and refined as
# reports come in. Promote to a required check once the signal is clean.

jobs:
  valgrind:
    name: valgrind (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true # informational — see header
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          # Same key pattern as ci.yml — shares the deps cache.
          cache-key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/patches/**') }}
          apt-packages: >-
            valgrind
            libc++-dev libc++abi-dev
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev
            libwayland-dev wayland-protocols libxkbcommon-dev
            libegl1-mesa-dev libgles2-mesa-dev
            libasound2-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev libibus-1.0-dev
            libatk1.0-dev libatk-bridge2.0-dev libatspi2.0-dev

      # Debug build: memcheck stacks stay readable and zig safety checks
      # stay on. Runtime is slower but the smokes are self-terminating.
      - name: Build
        run: zig build -Doptimize=Debug

      - name: Valgrind headless smokes
        run: scripts/valgrind.sh
